  /generate-document-glpi:
    get:
      tags:
      - Glpi Documents
      summary: Descarga un documento de GLPI
      description: Solo permite descargar Document/{id}?alt=media y devuelve el archivo binario como adjunto.
      operationId: generate_document_glpi
      parameters:
      - name: endpoint
        in: query
        required: true
        description: Endpoint de GLPI con el formato Document/2809?alt=media
        schema:
          type: string
          pattern: '^Document/[0-9]+\?alt=media$'
          example: Document/2809?alt=media
      - name: externalTransactionId
        in: header
        required: true
        schema:
          type: string
      - name: channel
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Archivo descargable
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Endpoint de documento invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Documento no encontrado
