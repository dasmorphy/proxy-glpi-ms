        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
  /commercial-origin:
    get:
      tags:
      - Catalogs
      summary: Obtiene todos los origines de comercial
      description: Devuelve todos los registros de la base
      operationId: get_commercial_origin
      parameters:
        - name: externalTransactionId
          in: header
