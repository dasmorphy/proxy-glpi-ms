openapi: 3.0.3
info:
  title: proxy-glpi-ms
  description: Proxy transparente para los endpoints REST de GLPI
  version: 1.0.0
servers:
- url: /rest/proxy-glpi-api/v1.0/
paths:
  /glpi-by-pass:
    parameters:
    - name: endpoint
      in: query
      required: true
      description: Endpoint relativo de GLPI, por ejemplo Ticket/123
      schema:
        type: string
        minLength: 1
    get:
      tags:
      - Glpi by Pass
      summary: Metodo para cualquier api get del glpi
      description: Realiza consultas para todas las api get del glpi
      operationId: get_glpi
      parameters:
      - name: externalTransactionId
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: fcea920f7412b5da7be0cf42b8c93759
      - name: channel
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: ZENTINEL
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
    post:
      tags:
      - Glpi by Pass
      summary: Metodos post para apis de glpi
      description: Realiza post para todas las apis del glpi
      operationId: post_glpi
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePostLogbookEntry"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
    delete:
      tags:
      - Glpi by Pass
      summary: Metodos delete para apis de glpi
      description: Realiza delete para todas las apis del glpi
      operationId: delete_glpi
      parameters:
      - name: externalTransactionId
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: fcea920f7412b5da7be0cf42b8c93759
      - name: channel
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: ZENTINEL
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePostLogbookOut"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
  /generate-document-glpi:
    get:
      tags:
      - Glpi Documents
      summary: Descarga un documento de GLPI
      description: Solo permite descargar Document/{id}?alt=media y devuelve el archivo binario como adjunto.
      operationId: generate_document_glpi
      parameters:
      - name: endpoint
        in: query
        required: true
        description: Endpoint de GLPI con el formato Document/2809?alt=media
        schema:
          type: string
          pattern: '^Document/[0-9]+\?alt=media$'
          example: Document/2809?alt=media
      - name: externalTransactionId
        in: header
        required: true
        schema:
          type: string
      - name: channel
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Archivo descargable
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Endpoint de documento invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Documento no encontrado
        "502":
          description: No fue posible consumir GLPI
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
  /inspection-documents/{id_document}:
    get:
      tags:
      - Inspection
      summary: Descarga un documento adjunto de una inspección
      description: >-
        Devuelve el archivo binario registrado en internal_management.inspection_documents.
        Con inline=true se sirve para visualizarlo en el navegador (pdf, imágenes);
        por defecto se descarga como adjunto.
      operationId: download_inspection_document
      parameters:
      - name: id_document
        in: path
        required: true
        schema:
          type: integer
          example: 1
      - name: inline
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: externalTransactionId
        in: header
        required: true
        schema:
          type: string
          example: "fcea920f7412b5da7be0cf42b8c93759"
      - name: channel
        in: header
        required: true
        schema:
          type: string
          example: "TLSG_WEB"
      responses:
        "200":
          description: Archivo del documento
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Documento no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
  /sale-quotation/{id_quote}/pdf:
    get:
      tags:
      - Tickets Management
      summary: Genera el PDF de una proforma
      description: >-
        Genera la cotización comercial de internal_management.sale_quotation en PDF.
        Con inline=true se sirve para visualizarlo en el navegador; por defecto se
        descarga como adjunto.
      operationId: download_sale_quotation_pdf
      parameters:
      - name: id_quote
        in: path
        required: true
        schema:
          type: integer
          example: 1
      - name: inline
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: externalTransactionId
        in: header
        required: true
        schema:
          type: string
          example: "fcea920f7412b5da7be0cf42b8c93759"
      - name: channel
        in: header
        required: true
        schema:
          type: string
          example: "TLSG_WEB"
      responses:
        "200":
          description: PDF de la proforma
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Proforma no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
  /type-solution:
    get:
      tags:
      - Catalogs
      summary: Obtiene todos los tipos de soluciones de comercial
      description: Devuelve todos los registros de la base
      operationId: get_type_solution
      parameters:
        - name: externalTransactionId
          in: header
          required: true
          schema:
            type: string
            example: "fcea920f7412b5da7be0cf42b8c93759"
        - name: channel
          in: header
