                $ref: "#/components/schemas/ResponseError"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
  /providers:
    get:
      tags:
      - Catalogs
      summary: Obtiene todos los proveedores
      description: Devuelve todos los proveedores de la base
      operationId: get_providers
      parameters:
        - name: externalTransactionId
          in: header
          required: true
          schema:
            type: string
            example: "fcea920f7412b5da7be0cf42b8c93759"
        - name: channel
          in: header
          required: true
          schema:
            type: string
            example: "TLSG_WEB"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
  /inspection:
    get:
      tags:
      - Inspection
      summary: Obtiene los tickets del área técnica
      description: Devuelve los tickets técnicos registrados en la base
      operationId: get_inspection_technical
      parameters:
        - name: id_inspection
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: responsible_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            example: fcea920f7412b5da7be0cf42b8c93759
        - name: pending_technical
          in: query
          required: false
          schema:
            type: boolean
            example: true
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
            example: "2025-01-21T00:00:00"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
            example: "2025-01-22T00:00:00"
        - name: pending_commercial
          in: query
          required: false
          schema:
            type: boolean
            example: true
        - name: ready_for_project
          in: query
          required: false
          description: Inspecciones con registro comercial aprobado y sin proyecto creado.
          schema:
            type: boolean
            example: true
        - name: status
          in: query
          required: false
          schema:
            type: string
            example: En proceso
        - name: management_status
          in: query
          required: false
          schema:
            type: string
            example: Pendiente
        - name: case_type
          in: query
          required: false
          schema:
            type: string
            example: Incidente
        - name: responsible
          in: query
          required: false
          schema:
            type: string
            example: dmales
        - name: sales_user
          in: query
          required: false
          description: Asesor comercial asignado (atributo user).
          schema:
            type: string
            example: dmales
        - name: client_id
          in: query
          required: false
          description: Uno o varios ids de cliente separados por coma.
          schema:
            type: string
            example: "1,2,3"
        - name: ubication_id
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: priority
          in: query
          required: false
          schema:
            type: string
            example: Alta
        - name: externalTransactionId
          in: header
          required: true
          schema:
            type: string
            example: "fcea920f7412b5da7be0cf42b8c93759"
        - name: channel
          in: header
          required: true
          schema:
            type: string
            example: "ZENTINEL"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
    post:
      tags:
      - Inspection
      summary: Guarda la inspeccion tecnica en la base de datos.
      description: Guardado de inspeccion
      operationId: post_inspection_technical
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: >-
                    JSON en texto con los campos de la inspección: client_id, ubication_id,
                    client_name, ubication_name, contact, case_type, priority, responsible_id,
                    responsible_name, management_status, title_ticket, commitment_date,
                    status, user.
                  example: '{"client_id": 1, "ubication_id": 1, "client_name": "TELEARGEG", "ubication_name": "GUAYAS", "contact": "Daniel", "case_type": "Cotización", "priority": "Alta", "responsible_id": "fcea920f-7412-b5da-7be0-cf42b8c93759", "responsible_name": "Daniel", "management_status": "En proceso", "title_ticket": "Propuesta zentinel", "commitment_date": "2024-06-01T12:00:00Z", "status": "En proceso", "user": "dmales"}'
                files:
                  $ref: "#/components/schemas/InspectionDocumentFiles"
                channel:
                  type: string
                  example: TLSG_WEB
                externalTransactionId:
                  type: string
                  example: fcea920f7412b5da7be0cf42b8c93759
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
  /inspection/{id_inspection}:
    put:
      tags:
      - Inspection
      summary: Actualiza la inspeccion tecnica en la base de datos.
      description: "Actualiza solo los campos enviados en data; ninguno es obligatorio."
      operationId: put_inspection_technical
      parameters:
        - name: id_inspection
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    client_id:
                      type: integer
                      example: 1
                    ubication_id:
                      type: integer
                      example: 1
                    client_name:
                      type: string
                      example: TELEARGEG
                    ubication_name:
                      type: string
                      example: GUAYAS
                    contact:
                      type: string
                      example: Daniel
                    priority:
                      type: string
                      example: Alta
                    responsible_id:
                      type: string
                      format: uuid
                      example: fcea920f7412b5da7be0cf42b8c93759
                    responsible_name:
                      type: string
                      example: Daniel
                    title_ticket:
                      type: string
                      example: Propuesta zentinel
                    status:
                      type: string
                      example: Listo para cotizar
                    user:
                      type: string
                      example: dmales
                channel:
                  type: string
                  example: TLSG_WEB
                externalTransactionId:
                  type: string
                  example: fcea920f7412b5da7be0cf42b8c93759
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
