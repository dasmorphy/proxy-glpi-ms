      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
    delete:
      tags:
      - Glpi by Pass
      summary: Metodos delete para apis de glpi
      description: Realiza delete para todas las apis del glpi
      operationId: delete_glpi
      parameters:
      - name: externalTransactionId
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: fcea920f7412b5da7be0cf42b8c93759
      - name: channel
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: ZENTINEL
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePostLogbookOut"
        "400":
          description: Bad request
          content:
            application/json:
