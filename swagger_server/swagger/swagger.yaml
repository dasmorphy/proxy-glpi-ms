openapi: 3.0.3
info:
  title: proxy-glpi-ms
  description: Proxy transparente para los endpoints REST de GLPI
  version: 1.0.0
servers:
- url: /rest/proxy-glpi-api/v1.0/
paths:
  /glpi-by-pass:
    parameters:
    - name: endpoint
      in: query
      required: true
      description: Endpoint relativo de GLPI, por ejemplo Ticket/123
      schema:
        type: string
        minLength: 1
    get:
      tags:
      - Glpi by Pass
      summary: Metodo para cualquier api get del glpi
      description: Realiza consultas para todas las api get del glpi
      operationId: get_glpi
      parameters:
      - name: externalTransactionId
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: fcea920f7412b5da7be0cf42b8c93759
      - name: channel
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: ZENTINEL
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
      x-openapi-router-controller: swagger_server.controllers.glpi_proxy_controller.GlpiProxyView
    post:
      tags:
      - Glpi by Pass
      summary: Metodos post para apis de glpi
      description: Realiza post para todas las apis del glpi
      operationId: post_glpi
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePostLogbookEntry"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
